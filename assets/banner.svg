<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }

      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      @keyframes dashMove {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }

      .pulse-orb-1 {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 180px 90px;
      }

      .pulse-orb-2 {
        animation: pulseGlow 8s ease-in-out infinite 2s;
        transform-origin: 1020px 270px;
      }

      .animated-card-1 {
        animation: floatCard 5s ease-in-out infinite;
      }

      .animated-card-2 {
        animation: floatCard 5s ease-in-out infinite 2.5s;
      }

      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashMove 12s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Ambient Orbs -->
  <circle class="pulse-orb-1" cx="180" cy="90" r="160" fill="#4f46e5" opacity="0.3" />
  <circle class="pulse-orb-2" cx="1020" cy="270" r="180" fill="#c084fc" opacity="0.25" />

  <!-- Grid Pattern Layer -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Animated Dynamic Paths -->
  <path class="flow-line" d="M 80,290 C 280,330 420,230 650,280 C 850,330 980,230 1120,290" fill="none" stroke="url(#accent-grad)" stroke-width="2.5" opacity="0.45" />
  <path class="flow-line" d="M 40,80 C 240,30 480,130 720,70 C 880,30 1020,110 1160,60" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4" />

  <!-- Right Visual Cards Block -->
  <g class="animated-card-1" transform="translate(850, 135)">
    <rect width="270" height="72" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="#10b981" opacity="0.25" />
    <path d="M 28 36 L 33 41 L 44 30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="66" y="32" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">Technician Dispatched</text>
    <text x="66" y="51" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11">GPS Route Optimized • 99.4%</text>
  </g>

  <g class="animated-card-2" transform="translate(810, 230)">
    <rect width="280" height="72" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="36" cy="36" r="18" fill="#6366f1" opacity="0.25" />
    <path d="M 28 29 L 44 29 M 28 36 L 40 36 M 28 43 L 36 43" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <text x="66" y="32" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">Work Orders &amp; Invoicing</text>
    <text x="66" y="51" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="11">SaaS &amp; Open-Source Operations</text>
  </g>

  <!-- Foreground Title and Meta Block -->
  <g id="foreground" transform="translate(65, 0)">

    <!-- Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="url(#accent-grad)" />
      <text x="160" y="21" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" letter-spacing="1" text-anchor="middle">
        FIELD SERVICE MANAGEMENT ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5">
      Awesome Field Service Management
    </text>

    <!-- Gradient Divider Bar -->
    <rect x="0" y="162" width="620" height="4" rx="2" fill="url(#accent-grad)" />

    <!-- Subtitle -->
    <text x="0" y="200" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal">
      Curated Directory of FSM SaaS Platforms &amp; Open-Source Solutions
    </text>

    <!-- Feature Tag Pills (Using clean Vector Icons instead of raw emojis for 100% SVG compatibility) -->
    <g transform="translate(0, 235)">
      <!-- Tag 1: Dispatch -->
      <g transform="translate(0, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
        <path d="M 16 16 L 24 16 M 22 12 L 26 16 L 22 20" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="34" y="20" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Dispatch &amp; Routing</text>
      </g>

      <!-- Tag 2: Work Orders -->
      <g transform="translate(155, 0)">
        <rect width="135" height="32" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
        <path d="M 17 12 H 23 M 17 16 H 25 M 17 20 H 21" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
        <text x="32" y="20" fill="#e9d5ff" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Work Orders</text>
      </g>

      <!-- Tag 3: Mobile Workforce -->
      <g transform="translate(300, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <rect x="15" y="11" width="10" height="14" rx="2" fill="none" stroke="#34d399" stroke-width="1.5" />
        <text x="33" y="20" fill="#a7f3d0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Mobile Workforce</text>
      </g>

      <!-- Tag 4: Open Source -->
      <g transform="translate(465, 0)">
        <rect width="150" height="32" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
        <circle cx="21" cy="16" r="5" fill="none" stroke="#fbbf24" stroke-width="1.5" />
        <text x="34" y="20" fill="#fde68a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Open-Source CMMS</text>
      </g>
    </g>

    <!-- Footer Note -->
    <text x="0" y="305" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal">
      Updated September 2026 • Maintained by @ishandutta2007
    </text>

  </g>
</svg>
